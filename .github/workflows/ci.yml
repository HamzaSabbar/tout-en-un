name: CI

on:
  push:
    branches: [main]
    paths:
      - "tout-en-un-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "tout-en-un-app/**"
      - ".github/workflows/ci.yml"
  # Permet de relancer la CI à la main quand un push ou une fusion ne l'a pas
  # déclenchée (panne GitHub Actions, filtre de chemin qui ne matche rien).
  workflow_dispatch: {}

defaults:
  run:
    working-directory: tout-en-un-app

jobs:
  ci:
    runs-on: ubuntu-latest

    # Base éphémère, détruite avec le job. Les tests de bout en bout écrivent et
    # suppriment massivement : ils ne doivent jamais viser une base partagée.
    # e2e/support/base-test.ts refuse de démarrer sur un hôte non local.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Base du service ci-dessus, et rien d'autre : aucun secret Supabase n'est
      # exposé au job, donc aucune exécution ne peut atteindre la base partagée.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      APP_URL: http://localhost:3000

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tout-en-un-app/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier les migrations Prisma
        run: npx prisma migrate deploy

      - name: Vérifier les types
        run: npm run typecheck

      - name: Analyse statique
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Construire l'application
        run: npm run build

      - name: Vérifier le budget JavaScript élève
        run: npm run budget:js

      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Test de bout en bout (build de production, base éphémère)
        run: npm run test:e2e

      - name: Archiver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tout-en-un-app/playwright-report/
            tout-en-un-app/test-results/
          if-no-files-found: warn
          retention-days: 7
